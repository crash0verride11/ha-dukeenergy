[project]
name = "ha-dukeenergy"
version = "0.3.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "freezegun>=1.5",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-homeassistant-custom-component>=0.13.0",
    "PyJWT>=2.8",
    "aiodukeenergy-co==1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
